<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>masume hero</title>
<!-- Source of assets/hero.png. Render: msedge --headless --screenshot=hero.png --window-size=1600,900 --force-device-scale-factor=2 hero.html -->
<style>
  :root {
    --ink: #161616;
    --sub: #5f6368;
    --grid: #e3e7e4;
    --green: #1e7145;   /* the green of a selected cell */
    --paper: #ffffff;
  }
  html, body { margin: 0; width: 1600px; height: 900px; background: var(--paper); overflow: hidden; }
  .card {
    position: absolute; inset: 0;
    background-color: var(--paper);
    /* 方眼紙: the whole card is graph paper */
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: -1px -1px;
    font-family: "Noto Sans JP", "Yu Gothic", sans-serif;
  }
  .content { position: absolute; left: 160px; top: 232px; }
  .word { display: flex; }
  .cell {
    width: 168px; height: 188px;
    display: flex; align-items: center; justify-content: center;
    font-size: 170px; font-weight: 900; color: var(--ink);
    line-height: 1; letter-spacing: 0;
    border: 3px solid var(--ink);
    margin-left: -3px;            /* shared borders, like merged-looking cells */
    background: var(--paper);
    position: relative;
    padding-bottom: 46px; box-sizing: border-box;
  }
  .cell:first-child { margin-left: 0; }
  .cell.active { z-index: 2; border: 9px solid var(--green); margin: -6px 0 -6px -9px; height: 200px; width: 180px; }
  .cell.active::after {          /* Excel's fill handle */
    content: ""; position: absolute; right: -16px; bottom: -16px;
    width: 22px; height: 22px; background: var(--green); border: 4px solid var(--paper);
  }
  .tag { margin-top: 80px; font-size: 60px; white-space: nowrap; font-weight: 900; color: var(--ink); letter-spacing: 0.02em; }
  .tag .g { color: var(--green); }
  .sub { margin-top: 26px; font-size: 30px; font-weight: 500; color: var(--sub); letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="card">
    <div class="content">
      <div class="word">
        <div class="cell">m</div><div class="cell">a</div><div class="cell active">s</div><div class="cell">u</div><div class="cell">m</div><div class="cell">e</div>
      </div>
      <div class="tag">神エクセルの申請書を、AIに<span class="g">壊さず</span>書かせる。</div>
      <div class="sub">Excel方眼紙の様式をそのまま読み書きする　CLI・MCP・ブラウザ版</div>
    </div>
  </div>
</body>
</html>
